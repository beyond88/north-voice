name: North Voice Autonomous News Agent

on:
  schedule:
    # Runs automatically every 30 minutes at off-peak minutes (:11 and :41) to avoid GitHub's top-of-the-hour queue delay
    - cron: '11,41 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI

permissions:
  contents: read

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🔤 Install Bengali Fonts & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-beng fonts-noto-core fonts-lohit-beng-bengali

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Install Playwright Chromium with OS Dependencies
        run: |
          playwright install chromium --with-deps

      - name: 🚀 Run North Voice Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          MAX_POSTS_PER_RUN: 1
        run: |
          python agent.py

      - name: 🖼️ Archive Generated Photocards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-photocards-${{ github.run_number }}
          path: output/*.png
          if-no-files-found: ignore
          retention-days: 7
