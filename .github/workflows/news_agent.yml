name: North Voice Autonomous News Agent

on:
  schedule:
    # Triggers every 15 mins at off-peak minutes (:07, :22, :37, :52).
    # The agent enforces a >= 25 min cooldown between posts to guarantee safe 30-min pacing on Facebook.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web UI

permissions:
  contents: read

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: 🌐 Install Playwright Chromium
        run: |
          playwright install chromium --with-deps

      - name: 🚀 Run North Voice Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          MAX_POSTS_PER_RUN: 1
        run: |
          python agent.py

      - name: 🖼️ Archive Generated Photocards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-photocards-${{ github.run_number }}
          path: output/*.png
          if-no-files-found: ignore
          retention-days: 7
