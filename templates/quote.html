<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700;800&family=Montserrat:wght@700;900&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1080px;
    height: 1350px;
    background: radial-gradient(circle at 75% 20%, #1e1b4b 0%, #090d16 60%, #030712 100%);
    font-family: 'Hind Siliguri', sans-serif;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 60px;
    position: relative;
    overflow: hidden;
  }

  /* Top Bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding-bottom: 24px;
    z-index: 10;
  }

  .logo-box {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-img {
    height: 56px;
    width: auto;
  }

  .brand-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 0.5px;
  }

  .brand-title span {
    color: #EF4444;
  }

  .meta-top {
    font-size: 20px;
    color: #94a3b8;
    font-weight: 600;
  }

  /* Main Quote Section */
  .main-section {
    position: relative;
    z-index: 10;
    margin: auto 0;
  }

  .quote-symbol {
    font-family: Georgia, serif;
    font-size: 130px;
    line-height: 0.8;
    color: #EF4444;
    opacity: 0.85;
    margin-bottom: 20px;
  }

  .quote-text {
    font-size: 50px;
    font-weight: 800;
    line-height: 1.35;
    color: #f8fafc;
    letter-spacing: -0.5px;
    margin-bottom: 40px;
  }

  .quote-text .highlight {
    color: #FACC15;
    text-shadow: 0 0 20px rgba(250, 204, 21, 0.3);
  }

  /* Speaker Details */
  .speaker-box {
    display: flex;
    align-items: center;
    gap: 24px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-left: 6px solid #EF4444;
    padding: 20px 28px;
    border-radius: 12px;
    max-width: 800px;
  }

  .speaker-avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #EF4444;
  }

  .speaker-info {
    display: flex;
    flex-direction: column;
  }

  .speaker-name {
    font-size: 32px;
    font-weight: 800;
    color: #ffffff;
  }

  .speaker-title {
    font-size: 22px;
    color: #cbd5e1;
    font-weight: 600;
  }

  /* Bottom Bar */
  .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 24px;
    font-size: 20px;
    color: #64748b;
    z-index: 10;
  }

  .tagline {
    color: #94a3b8;
    font-weight: 600;
  }

  .handle {
    font-family: 'Montserrat', sans-serif;
    color: #f8fafc;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="top-bar">
    <div class="logo-box">
      <img src="{{ logo_path }}" class="logo-img" alt="Logo">
      <div class="brand-title">NORTH <span>VOICE</span></div>
    </div>
    <div class="meta-top">
      সূত্র: {{ source }} | {{ bangla_date }}
    </div>
  </div>

  <div class="main-section">
    <div class="quote-symbol">“</div>
    <div class="quote-text">
      {{ headline_html | safe }}
    </div>

    {% if speaker_name %}
    <div class="speaker-box">
      {% if image_path %}
      <img src="{{ image_path }}" class="speaker-avatar" alt="Speaker">
      {% endif %}
      <div class="speaker-info">
        <div class="speaker-name">- {{ speaker_name }}</div>
        {% if speaker_title %}
        <div class="speaker-title">{{ speaker_title }}</div>
        {% endif %}
      </div>
    </div>
    {% endif %}
  </div>

  <div class="bottom-bar">
    <div class="tagline">উত্তরবঙ্গের প্রতিটি জনপদের বলিষ্ঠ কণ্ঠস্বর</div>
    <div class="handle">fb.com/northvoicebd</div>
  </div>
</body>
</html>
