<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<style>
  {{ font_styles | safe }}

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1080px;
    height: 1350px;
    background: radial-gradient(circle at 80% 85%, #1e1b4b 0%, #090d16 50%, #030712 100%);
    font-family: 'SolaimanLipi', 'Kalpurush', sans-serif;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 60px 70px;
    position: relative;
    overflow: hidden;
  }

  /* Top Bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    padding-bottom: 24px;
    z-index: 10;
  }

  .logo-box {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-img {
    height: 52px;
    width: auto;
    filter: brightness(0) invert(1);
  }

  .brand-title {
    font-family: system-ui, sans-serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.5px;
  }

  .brand-title span {
    color: #EF4444;
  }

  .meta-top {
    font-size: 19px;
    color: #94a3b8;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-family: system-ui, sans-serif;
  }

  /* Main Quote Section */
  .main-section {
    position: relative;
    z-index: 10;
    margin: auto 0;
    max-width: 940px;
  }

  .quote-symbol {
    font-size: 110px;
    line-height: 0.7;
    color: #EF4444;
    font-family: Georgia, serif;
    margin-bottom: 24px;
  }

  .quote-text {
    font-size: 56px;
    font-weight: 700;
    line-height: 1.35;
    color: #ffffff;
    letter-spacing: -0.3px;
    margin-bottom: 36px;
    font-family: 'SolaimanLipi', 'Kalpurush', sans-serif;
    text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
  }

  .quote-text .highlight {
    color: #FACC15;
    font-weight: 700;
    text-shadow: 0 0 20px rgba(250, 204, 21, 0.4);
  }

  /* Speaker Details */
  .speaker-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 20px;
  }

  .speaker-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .speaker-name {
    font-size: 38px;
    font-weight: 700;
    color: #ffffff;
    font-family: 'SolaimanLipi', sans-serif;
  }

  .speaker-title {
    font-size: 24px;
    color: #cbd5e1;
    font-weight: 500;
    font-family: 'SolaimanLipi', sans-serif;
  }

  .speaker-avatar-wrap {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid #EF4444;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(239, 68, 68, 0.3);
  }

  .speaker-avatar-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Bottom Bar */
  .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    padding-top: 24px;
    font-size: 20px;
    color: #64748b;
    z-index: 10;
  }

  .tagline {
    color: #94a3b8;
    font-weight: 600;
    font-family: 'SolaimanLipi', sans-serif;
  }

  .handle {
    font-family: system-ui, sans-serif;
    color: #f8fafc;
    font-weight: 700;
    font-size: 21px;
  }
</style>
</head>
<body>
  <div class="top-bar">
    <div class="logo-box">
      <img src="{{ logo_path }}" class="logo-img" alt="Logo">
      <div class="brand-title">NORTH <span>VOICE</span></div>
    </div>
    <div class="meta-top">
      SOURCE: {{ source }} | {{ bangla_date }}
    </div>
  </div>

  <div class="main-section">
    <div class="quote-symbol">“</div>
    <div class="quote-text">
      {{ headline_html | safe }}
    </div>

    <div class="speaker-container">
      <div class="speaker-info">
        {% if speaker_name %}
        <div class="speaker-name">- {{ speaker_name }}</div>
        {% endif %}
        {% if speaker_title %}
        <div class="speaker-title">{{ speaker_title }}</div>
        {% endif %}
      </div>

      {% if image_path %}
      <div class="speaker-avatar-wrap">
        <img src="{{ image_path }}" alt="Speaker Portrait">
      </div>
      {% endif %}
    </div>
  </div>

  <div class="bottom-bar">
    <div class="tagline">উত্তরবঙ্গের প্রতিটি জনপদের বলিষ্ঠ কণ্ঠস্বর</div>
    <div class="handle">fb.com/northvoicebd</div>
  </div>
</body>
</html>
