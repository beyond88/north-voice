<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<style>
  {{ font_styles | safe }}

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1080px;
    height: 1350px;
    background: #030712;
    background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 45%, #030712 100%);
    font-family: 'SolaimanLipi', 'Kalpurush', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 50px 60px 45px 60px;
    position: relative;
    overflow: hidden;
  }

  /* Top Bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo-box {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-img {
    height: 52px;
    width: auto;
    filter: brightness(0) invert(1);
  }

  .brand-title {
    font-family: system-ui, sans-serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.5px;
    color: #ffffff;
  }

  .brand-title span {
    color: #EF4444;
  }

  .district-badge {
    background: #E50914;
    color: #ffffff;
    font-size: 22px;
    font-weight: 700;
    padding: 6px 20px;
    border-radius: 6px;
    font-family: 'SolaimanLipi', sans-serif;
  }

  /* Graphic / Photo Area */
  .center-visual {
    width: 960px;
    height: 560px;
    margin: 10px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .center-visual img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  /* Headline Section (Inqilab Style) */
  .headline-section {
    text-align: center;
    margin-bottom: 20px;
  }

  .subhead {
    font-size: 32px;
    color: #ffffff;
    font-weight: 600;
    margin-bottom: 16px;
    font-family: 'SolaimanLipi', sans-serif;
  }

  .main-headline {
    font-size: 58px;
    font-weight: 700;
    line-height: 1.35;
    color: #ffffff;
    letter-spacing: -0.3px;
    font-family: 'SolaimanLipi', 'Kalpurush', sans-serif;
  }

  .main-headline .highlight {
    color: #84CC16; /* Inqilab Vibrant Lime-Green */
    text-shadow: 0 0 20px rgba(132, 204, 22, 0.4);
  }

  /* Footer */
  .footer-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    padding-top: 20px;
    color: #94A3B8;
    font-size: 20px;
    font-family: 'SolaimanLipi', sans-serif;
  }

  .handle {
    font-family: system-ui, sans-serif;
    color: #ffffff;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="top-bar">
    <div class="logo-box">
      <img src="{{ logo_path }}" class="logo-img" alt="Logo">
      <div class="brand-title">NORTH <span>VOICE</span></div>
    </div>
    {% if district %}
    <div class="district-badge">{{ district }} বার্তা</div>
    {% endif %}
  </div>

  <div class="center-visual">
    <img src="{{ image_path }}" alt="Visual">
  </div>

  <div class="headline-section">
    {% if sub_headline %}
    <div class="subhead">{{ sub_headline }}</div>
    {% endif %}
    <div class="main-headline">
      {{ headline_html | safe }}
    </div>
  </div>

  <div class="footer-bar">
    <div>সূত্র: {{ source }} | {{ bangla_date }}</div>
    <div class="handle">fb.com/northvoicebd</div>
  </div>
</body>
</html>
