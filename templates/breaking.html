<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<style>
  {{ font_styles | safe }}

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1080px;
    height: 1350px;
    background: #0f172a;
    font-family: 'SolaimanLipi', 'Kalpurush', sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* Photo Section (Top 60%) */
  .image-container {
    width: 1080px;
    height: 800px;
    position: relative;
    overflow: hidden;
    background: #1e293b;
  }

  .main-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  /* Deep gradient fade at the bottom of the photo */
  .image-fade {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 220px;
    background: linear-gradient(to top, rgba(136, 19, 55, 1) 0%, rgba(136, 19, 55, 0.6) 30%, transparent 100%);
  }

  /* Badges */
  .badge-container {
    position: absolute;
    bottom: 24px;
    left: 60px;
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 5;
  }

  .live-pill {
    background: #E50914;
    color: #ffffff;
    font-size: 26px;
    font-weight: 700;
    padding: 6px 22px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    font-family: 'SolaimanLipi', sans-serif;
  }

  .district-pill {
    background: rgba(0, 0, 0, 0.65);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #f8fafc;
    font-size: 24px;
    font-weight: 600;
    padding: 6px 20px;
    border-radius: 8px;
    backdrop-filter: blur(8px);
    font-family: 'SolaimanLipi', sans-serif;
  }

  /* Bottom Content Block - Rich Editorial Crimson */
  .content-block {
    flex: 1;
    background: linear-gradient(180deg, #881337 0%, #6f112d 100%);
    padding: 30px 60px 32px 60px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    border-top: 3px solid rgba(255, 255, 255, 0.15);
  }

  /* Headline with Newspaper Typography */
  .headline-container {
    display: flex;
    align-items: center;
    flex: 1;
    padding-top: 5px;
    padding-bottom: 10px;
  }

  .headline {
    color: #ffffff;
    font-size: 62px;
    font-weight: 700;
    line-height: 1.32;
    letter-spacing: -0.3px;
    font-family: 'SolaimanLipi', 'Kalpurush', sans-serif;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  }

  /* Smooth Highlight without clunky background boxes */
  .headline .highlight {
    color: #FACC15;
    font-weight: 700;
    text-shadow: 0 0 15px rgba(250, 204, 21, 0.35);
  }

  /* Footer Bar */
  .footer-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    padding-top: 24px;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .logo-img {
    height: 60px;
    width: auto;
    filter: brightness(0) invert(1);
  }

  .brand-text {
    display: flex;
    flex-direction: column;
  }

  .brand-name {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 26px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 0.5px;
    line-height: 1.1;
  }

  .brand-tagline {
    font-size: 18px;
    color: #fecdd3;
    font-weight: 600;
    font-family: system-ui, sans-serif;
  }

  .meta-group {
    text-align: right;
    color: #fecdd3;
    font-size: 21px;
    font-weight: 600;
    line-height: 1.4;
    font-family: 'SolaimanLipi', sans-serif;
  }

  .source-tag {
    color: #ffffff;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="image-container">
    <img src="{{ image_path }}" class="main-image" alt="News Image">
    <div class="image-fade"></div>
    <div class="badge-container">
      <div class="live-pill">সদ্য প্রাপ্ত</div>
      {% if district %}
      <div class="district-pill">{{ district }} বার্তা</div>
      {% endif %}
    </div>
  </div>

  <div class="content-block">
    <div class="headline-container">
      <div class="headline">
        {{ headline_html | safe }}
      </div>
    </div>

    <div class="footer-bar">
      <div class="brand-group">
        <img src="{{ logo_path }}" class="logo-img" alt="North Voice Logo">
        <div class="brand-text">
          <div class="brand-name">NORTH VOICE</div>
          <div class="brand-tagline">fb.com/northvoicebd</div>
        </div>
      </div>
      <div class="meta-group">
        <div class="source-tag">সূত্র: {{ source }}</div>
        <div>{{ bangla_date }}</div>
      </div>
    </div>
  </div>
</body>
</html>
