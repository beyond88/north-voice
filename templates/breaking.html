<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700;800&family=Montserrat:wght@700;900&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1080px;
    height: 1350px;
    background: #0f172a;
    font-family: 'Hind Siliguri', sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* Image Area (Top 55%) */
  .image-container {
    width: 1080px;
    height: 720px;
    position: relative;
    overflow: hidden;
    background: #1e293b;
  }

  .main-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  /* Gradient Overlay at the bottom of the image */
  .image-fade {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 180px;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, transparent 100%);
  }

  /* Category / District Badge */
  .badge-container {
    position: absolute;
    bottom: 24px;
    left: 54px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .live-pill {
    background: #E50914;
    color: #ffffff;
    font-size: 24px;
    font-weight: 700;
    padding: 6px 20px;
    border-radius: 6px;
    text-transform: uppercase;
    box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
  }

  .district-pill {
    background: rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #f1f5f9;
    font-size: 22px;
    font-weight: 600;
    padding: 6px 18px;
    border-radius: 6px;
    backdrop-filter: blur(8px);
  }

  /* Bottom Content Block (Crimson / Deep Red Editorial Block) */
  .content-block {
    flex: 1;
    background: #B91C1C;
    background: linear-gradient(180deg, #991B1B 0%, #7F1D1D 100%);
    padding: 48px 54px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    border-top: 4px solid #EF4444;
  }

  /* Headline */
  .headline-container {
    margin-top: 10px;
  }

  .headline {
    color: #ffffff;
    font-size: 52px;
    font-weight: 800;
    line-height: 1.35;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  }

  .headline .highlight {
    color: #FACC15;
    background: rgba(0, 0, 0, 0.2);
    padding: 2px 10px;
    border-radius: 8px;
  }

  /* Footer / Branding Bar */
  .footer-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    padding-top: 24px;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-img {
    height: 64px;
    width: auto;
    filter: brightness(0) invert(1);
  }

  .brand-text {
    display: flex;
    flex-direction: column;
  }

  .brand-name {
    font-family: 'Montserrat', sans-serif;
    font-size: 26px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 0.5px;
  }

  .brand-tagline {
    font-size: 17px;
    color: #fecaca;
    font-weight: 600;
  }

  .meta-group {
    text-align: right;
    color: #fee2e2;
    font-size: 19px;
    font-weight: 600;
    line-height: 1.4;
  }

  .source-tag {
    color: #ffffff;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="image-container">
    <img src="{{ image_path }}" class="main-image" alt="News Image">
    <div class="image-fade"></div>
    <div class="badge-container">
      <div class="live-pill">সদ্য প্রাপ্ত</div>
      {% if district %}
      <div class="district-pill">{{ district }} বার্তা</div>
      {% endif %}
    </div>
  </div>

  <div class="content-block">
    <div class="headline-container">
      <div class="headline">
        {{ headline_html | safe }}
      </div>
    </div>

    <div class="footer-bar">
      <div class="brand-group">
        <img src="{{ logo_path }}" class="logo-img" alt="North Voice Logo">
        <div class="brand-text">
          <div class="brand-name">NORTH VOICE</div>
          <div class="brand-tagline">fb.com/northvoicebd</div>
        </div>
      </div>
      <div class="meta-group">
        <div class="source-tag">সূত্র: {{ source }}</div>
        <div>{{ bangla_date }}</div>
      </div>
    </div>
  </div>
</body>
</html>
