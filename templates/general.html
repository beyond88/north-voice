<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<style>
  {{ font_styles | safe }}

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1080px;
    height: 1350px;
    background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #030712 100%);
    font-family: 'SolaimanLipi', 'Kalpurush', sans-serif;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 50px 60px;
    position: relative;
    overflow: hidden;
  }

  /* Top Bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo-box {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-img {
    height: 56px;
    width: auto;
    filter: brightness(0) invert(1);
  }

  .brand-title {
    font-family: system-ui, sans-serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.5px;
    color: #ffffff;
  }

  .brand-title span {
    color: #EF4444;
  }

  .district-tag {
    background: #E50914;
    color: #ffffff;
    font-size: 22px;
    font-weight: 700;
    padding: 6px 20px;
    border-radius: 20px;
    font-family: 'SolaimanLipi', sans-serif;
    box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
  }

  /* Framed Image Card */
  .image-card {
    width: 960px;
    height: 580px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    border: 2px solid rgba(255, 255, 255, 0.15);
    background: #1e1b4b;
    margin: 15px 0;
  }

  .image-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Middle Meta Bar */
  .middle-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 22px;
    font-weight: 700;
    color: #F87171;
    margin-bottom: 8px;
    font-family: 'SolaimanLipi', sans-serif;
  }

  /* Headline Section */
  .headline-section {
    margin-bottom: 15px;
  }

  .main-headline {
    font-size: 56px;
    font-weight: 700;
    line-height: 1.35;
    color: #f8fafc;
    letter-spacing: -0.3px;
    font-family: 'SolaimanLipi', 'Kalpurush', serif;
  }

  .main-headline .highlight {
    color: #FACC15;
    text-shadow: 0 0 15px rgba(250, 204, 21, 0.35);
  }

  /* Footer Bar */
  .footer-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    padding-top: 22px;
  }

  .tagline {
    font-size: 20px;
    color: #cbd5e1;
    font-weight: 600;
    font-family: 'SolaimanLipi', sans-serif;
  }

  .handle {
    font-family: system-ui, sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
    background: rgba(255, 255, 255, 0.08);
    padding: 6px 20px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
</style>
</head>
<body>
  <div class="top-bar">
    <div class="logo-box">
      <img src="{{ logo_path }}" class="logo-img" alt="Logo">
      <div class="brand-title">NORTH <span>VOICE</span></div>
    </div>
    {% if district %}
    <div class="district-tag">{{ district }}</div>
    {% endif %}
  </div>

  <div class="image-card">
    <img src="{{ image_path }}" alt="News Photo">
  </div>

  <div class="middle-meta">
    <div>সূত্র: {{ source }}</div>
    <div>তারিখ: {{ bangla_date }}</div>
  </div>

  <div class="headline-section">
    <div class="main-headline">
      {{ headline_html | safe }}
    </div>
  </div>

  <div class="footer-bar">
    <div class="tagline">উত্তরবঙ্গের প্রতিটি জনপদের বলিষ্ঠ কণ্ঠস্বর</div>
    <div class="handle">fb.com/northvoicebd</div>
  </div>
</body>
</html>
