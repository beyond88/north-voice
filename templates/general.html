<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<style>
  {{ font_styles | safe }}

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1080px;
    height: 1350px;
    background: #F8F6F0;
    background: radial-gradient(circle at 50% 10%, #ffffff 0%, #F5F3EC 70%, #ECE9E1 100%);
    font-family: 'Kalpurush', 'SolaimanLipi', sans-serif;
    color: #111827;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 50px 60px;
    position: relative;
    overflow: hidden;
  }

  /* Top Bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo-box {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-img {
    height: 56px;
    width: auto;
  }

  .brand-title {
    font-family: system-ui, sans-serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.5px;
    color: #0f172a;
  }

  .brand-title span {
    color: #EF4444;
  }

  .district-tag {
    background: #0f172a;
    color: #ffffff;
    font-size: 22px;
    font-weight: 700;
    padding: 6px 20px;
    border-radius: 20px;
    font-family: 'SolaimanLipi', sans-serif;
  }

  /* Framed Image Card */
  .image-card {
    width: 960px;
    height: 580px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
    border: 3px solid #ffffff;
    background: #e2e8f0;
    margin: 15px 0;
  }

  .image-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Middle Meta Bar (Like Channel 24 Style) */
  .middle-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 22px;
    font-weight: 700;
    color: #DC2626;
    margin-bottom: 8px;
    font-family: 'SolaimanLipi', sans-serif;
  }

  /* Headline Section (Two-Tone Newspaper Serif) */
  .headline-section {
    margin-bottom: 15px;
  }

  .main-headline {
    font-size: 56px;
    font-weight: 700;
    line-height: 1.35;
    color: #111827;
    letter-spacing: -0.3px;
    font-family: 'Kalpurush', 'SolaimanLipi', serif;
  }

  .main-headline .highlight {
    color: #DC2626;
  }

  /* Footer Bar */
  .footer-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 2px solid #E5E7EB;
    padding-top: 22px;
  }

  .tagline {
    font-size: 20px;
    color: #4B5563;
    font-weight: 600;
    font-family: 'SolaimanLipi', sans-serif;
  }

  .handle {
    font-family: system-ui, sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #111827;
    background: #ffffff;
    padding: 6px 20px;
    border-radius: 20px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    border: 1px solid #E5E7EB;
  }
</style>
</head>
<body>
  <div class="top-bar">
    <div class="logo-box">
      <img src="{{ logo_path }}" class="logo-img" alt="Logo">
      <div class="brand-title">NORTH <span>VOICE</span></div>
    </div>
    {% if district %}
    <div class="district-tag">{{ district }}</div>
    {% endif %}
  </div>

  <div class="image-card">
    <img src="{{ image_path }}" alt="News Photo">
  </div>

  <div class="middle-meta">
    <div>সূত্র: {{ source }}</div>
    <div>তারিখ: {{ bangla_date }}</div>
  </div>

  <div class="headline-section">
    <div class="main-headline">
      {{ headline_html | safe }}
    </div>
  </div>

  <div class="footer-bar">
    <div class="tagline">উত্তরবঙ্গের প্রতিটি জনপদের বলিষ্ঠ কণ্ঠস্বর</div>
    <div class="handle">fb.com/northvoicebd</div>
  </div>
</body>
</html>
