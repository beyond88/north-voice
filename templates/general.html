<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700;800&family=Montserrat:wght@700;900&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1080px;
    height: 1350px;
    background: #F1F5F9;
    background: radial-gradient(circle at 10% 10%, #ecfdf5 0%, #f8fafc 50%, #f1f5f9 100%);
    font-family: 'Hind Siliguri', sans-serif;
    color: #0f172a;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 50px 60px;
    position: relative;
    overflow: hidden;
  }

  /* Top Bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo-box {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-img {
    height: 60px;
    width: auto;
  }

  .brand-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 0.5px;
  }

  .brand-title span {
    color: #EF4444;
  }

  .district-tag {
    background: #0f172a;
    color: #ffffff;
    font-size: 20px;
    font-weight: 700;
    padding: 6px 18px;
    border-radius: 20px;
  }

  /* Framed Image Card */
  .image-card {
    width: 960px;
    height: 560px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
    border: 3px solid #ffffff;
    background: #cbd5e1;
    margin: 20px 0;
  }

  .image-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Headline Section */
  .headline-section {
    margin-bottom: 20px;
  }

  .subhead {
    font-size: 26px;
    color: #475569;
    font-weight: 600;
    margin-bottom: 12px;
  }

  .main-headline {
    font-size: 50px;
    font-weight: 800;
    line-height: 1.35;
    color: #0f172a;
    letter-spacing: -0.5px;
  }

  .main-headline .highlight {
    color: #DC2626;
  }

  /* Footer */
  .footer-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 2px solid #e2e8f0;
    padding-top: 24px;
  }

  .source-info {
    font-size: 20px;
    color: #64748b;
    font-weight: 600;
  }

  .source-info strong {
    color: #0f172a;
  }

  .handle {
    font-family: 'Montserrat', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #0f172a;
    background: #ffffff;
    padding: 6px 18px;
    border-radius: 20px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    border: 1px solid #e2e8f0;
  }
</style>
</head>
<body>
  <div class="top-bar">
    <div class="logo-box">
      <img src="{{ logo_path }}" class="logo-img" alt="Logo">
      <div class="brand-title">NORTH <span>VOICE</span></div>
    </div>
    {% if district %}
    <div class="district-tag">{{ district }}</div>
    {% endif %}
  </div>

  <div class="image-card">
    <img src="{{ image_path }}" alt="News Photo">
  </div>

  <div class="headline-section">
    {% if sub_headline %}
    <div class="subhead">{{ sub_headline }}</div>
    {% endif %}
    <div class="main-headline">
      {{ headline_html | safe }}
    </div>
  </div>

  <div class="footer-bar">
    <div class="source-info">
      সূত্র: <strong>{{ source }}</strong> | {{ bangla_date }}
    </div>
    <div class="handle">fb.com/northvoicebd</div>
  </div>
</body>
</html>
