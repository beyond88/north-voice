<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Montserrat:wght@800;900&display=swap');
  
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  body {
    width: 1640px;
    height: 624px;
    background: radial-gradient(circle at 80% 40%, #2A080C 0%, #120A10 40%, #0A0D14 100%);
    font-family: 'Hind Siliguri', sans-serif;
    color: #ffffff;
    display: flex;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  /* Background Grid & Soundwave Graphics */
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.8;
  }

  .glow-red {
    position: absolute;
    right: -100px;
    top: -100px;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(220, 38, 38, 0.35) 0%, rgba(220, 38, 38, 0) 70%);
    filter: blur(40px);
  }

  .glow-green {
    position: absolute;
    bottom: -150px;
    left: 100px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(16, 185, 129, 0) 70%);
    filter: blur(50px);
  }

  .container {
    position: relative;
    z-index: 10;
    width: 100%;
    padding: 0 100px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .left-content {
    max-width: 950px;
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(220, 38, 38, 0.15);
    border: 1px solid rgba(220, 38, 38, 0.4);
    padding: 6px 16px;
    border-radius: 30px;
    font-size: 18px;
    font-weight: 600;
    color: #ff6b6b;
    margin-bottom: 24px;
    letter-spacing: 0.5px;
  }

  .pulse-dot {
    width: 10px;
    height: 10px;
    background: #ef4444;
    border-radius: 50%;
    box-shadow: 0 0 10px #ef4444;
  }

  .brand-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 78px;
    font-weight: 900;
    letter-spacing: -1px;
    line-height: 1;
    color: #ffffff;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .brand-title span.voice {
    color: #EF4444;
    position: relative;
  }

  .tagline {
    font-size: 38px;
    font-weight: 700;
    color: #E2E8F0;
    line-height: 1.3;
    margin-bottom: 24px;
  }

  .tagline span.highlight {
    color: #FACC15;
    background: rgba(250, 204, 21, 0.1);
    padding: 2px 10px;
    border-radius: 6px;
  }

  .districts-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 16px;
    font-weight: 600;
    color: #94A3B8;
  }

  .district-tag {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 4px 14px;
    border-radius: 20px;
  }

  .right-visual {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .logo-box {
    width: 250px;
    height: 250px;
    background: #ffffff;
    border-radius: 36px;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(220, 38, 38, 0.3);
    border: 2px solid rgba(255, 255, 255, 0.2);
  }

  .logo-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .handle-badge {
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 8px 20px;
    border-radius: 30px;
    font-size: 20px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    color: #F8FAFC;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow-red"></div>
  <div class="glow-green"></div>

  <div class="container">
    <div class="left-content">
      <div class="live-badge">
        <div class="pulse-dot"></div>
        ২৪/৭ বস্তুনিষ্ঠ ও নিরপেক্ষ আঞ্চলিক সংবাদ
      </div>
      
      <div class="brand-title">
        NORTH <span class="voice">VOICE</span>
      </div>

      <div class="tagline">
        <span class="highlight">উত্তরবঙ্গের</span> প্রতিটি জনপদের বলিষ্ঠ কণ্ঠস্বর
      </div>

      <div class="districts-bar">
        <div class="district-tag">বগুড়া</div>
        <div class="district-tag">রংপুর</div>
        <div class="district-tag">দিনাজপুর</div>
        <div class="district-tag">রাজশাহী</div>
        <div class="district-tag">পাবনা</div>
        <div class="district-tag">সিরাজগঞ্জ</div>
        <div class="district-tag">নওগাঁ</div>
        <div class="district-tag">কুড়িগ্রাম</div>
        <div class="district-tag">পঞ্চগড়</div>
      </div>
    </div>

    <div class="right-visual">
      <div class="logo-box">
        <img src="file:///Users/mohiuddinabdulkader/Sites/north-news/assets/branding/North_Voice_Final_Logo.jpg" alt="North Voice Logo">
      </div>
      <div class="handle-badge">
        fb.com/northvoicebd
      </div>
    </div>
  </div>
</body>
</html>
