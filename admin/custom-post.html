<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>North Voice · কাস্টম পোস্ট স্টুডিও</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dash26-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <style>
      .studio-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 24px;
        margin-top: 20px;
      }
      @media (max-width: 900px) {
        .studio-grid { grid-template-columns: 1fr; }
      }
      .preview-box {
        background: #0f172a;
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 480px;
        border: 1px solid var(--border);
      }
      .tmpl-pill {
        padding: 8px 14px;
        border-radius: 20px;
        font-size: 12.5px;
        font-weight: 700;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--bg-surface, #fff);
        color: var(--t-primary, #0f172a);
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .tmpl-pill:hover {
        border-color: #EF4444;
        color: #EF4444;
      }
      .tmpl-pill.active {
        background: #EF4444;
        color: #ffffff;
        border-color: #EF4444;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35);
      }
    </style>
  </head>
  <body data-active="custom-post" data-crumbs="সংবাদ ব্যবস্থাপনা | কাস্টম পোস্ট স্টুডিও">
    <div class="shell">
      <div data-shell-sidebar></div>
      <div class="main">
        <div data-shell-topbar></div>
        <main class="content">

        <!-- HERO -->
        <section class="hero">
          <div class="hero-text">
            <span class="eyebrow">ম্যানুয়াল সংবাদ ও ৫টি টেমপ্লেট স্টুডিও</span>
            <h1 class="hero-title">কাস্টম পোস্ট <span class="accent">স্টুডিও</span></h1>
            <p class="hero-sub">নিজস্ব সংবাদ, ফটোকার্ড তৈরি ও তাৎক্ষণিক ফেসবুক পেজে প্রকাশের পূর্ণাঙ্গ ওয়ার্কস্পেস।</p>
          </div>
        </section>

        <!-- STUDIO FORM & PREVIEW -->
        <div class="studio-grid">
          <!-- Form -->
          <div class="card" style="padding: 24px;">
            <h3 style="font-size: 16px; font-weight: 700; margin: 0 0 16px 0;">সংবাদের তথ্য ও ডিজাইন কনফিগারেশন</h3>
            <form onsubmit="event.preventDefault(); publishCustom();">
              <div class="field" style="margin-bottom: 14px;">
                <label class="field-label">সংবাদের মূল শিরোনাম (Headline)</label>
                <input type="text" id="custTitle" class="input" placeholder="আকর্ষণীয় শিরোনাম লিখুন..." required oninput="debouncePreview()">
              </div>

              <div class="field" style="margin-bottom: 16px;">
                <label class="field-label" style="display: flex; justify-content: space-between; align-items: center;">
                  <span>ফটোকার্ডের টেমপ্লেট নির্বাচন করুন (৫টি ডিজাইন)</span>
                  <span id="activeTemplateBadge" style="font-size: 11px; background: rgba(239, 68, 68, 0.1); color: #EF4444; padding: 2px 8px; border-radius: 10px; font-weight: 700;">BREAKING</span>
                </label>
                <input type="hidden" id="custTemplate" value="breaking">
                <div class="tmpl-pill-bar" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px;">
                  <button type="button" class="tmpl-pill" data-tmpl="viral" onclick="selectCustomTemplate('viral')">🌟 Viral</button>
                  <button type="button" class="tmpl-pill active" data-tmpl="breaking" onclick="selectCustomTemplate('breaking')">🚨 Breaking</button>
                  <button type="button" class="tmpl-pill" data-tmpl="inqilab_style" onclick="selectCustomTemplate('inqilab_style')">📰 Inqilab Style</button>
                  <button type="button" class="tmpl-pill" data-tmpl="quote" onclick="selectCustomTemplate('quote')">💬 Quote Card</button>
                  <button type="button" class="tmpl-pill" data-tmpl="general" onclick="selectCustomTemplate('general')">💎 General</button>
                </div>
              </div>

              <div id="quoteFields" style="display: none; background: rgba(0,0,0,0.03); padding: 12px; border-radius: 8px; margin-bottom: 14px; border: 1px dashed var(--border);">
                <div class="field" style="margin-bottom: 10px;">
                  <label class="field-label">বক্তার নাম (Speaker Name)</label>
                  <input type="text" id="custSpeakerName" class="input" placeholder="উদা: অধ্যাপক ড. মুহাম্মদ ইউনূস" oninput="debouncePreview()">
                </div>
                <div class="field">
                  <label class="field-label">বক্তার পদবি (Speaker Title)</label>
                  <input type="text" id="custSpeakerTitle" class="input" placeholder="উদা: প্রধান উপদেষ্টা, অন্তর্বর্তীকালীন সরকার" oninput="debouncePreview()">
                </div>
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;">
                <div class="field">
                  <label class="field-label">জেলা / এলাকা</label>
                  <select id="custDistrict" class="input" onchange="debouncePreview()">
                    <option value="সারা দেশ">সারা দেশ</option>
                    <option value="আন্তর্জাতিক">আন্তর্জাতিক</option>
                    <option value="বগুড়া">বগুড়া</option>
                    <option value="রংপুর">রংপুর</option>
                    <option value="দিনাজপুর">দিনাজপুর</option>
                    <option value="সিরাজগঞ্জ">সিরাজগঞ্জ</option>
                    <option value="পাবনা">পাবনা</option>
                    <option value="নওগাঁ">নওগাঁ</option>
                    <option value="নাটোর">নাটোর</option>
                    <option value="কুড়িগ্রাম">কুড়িগ্রাম</option>
                    <option value="গাইবান্ধা">গাইবান্ধা</option>
                    <option value="নীলফামারী">নীলফামারী</option>
                    <option value="পঞ্চগড়">পঞ্চগড়</option>
                    <option value="ঠাকুরগাঁও">ঠাকুরগাঁও</option>
                    <option value="লালমনিরহাট">লালমনিরহাট</option>
                    <option value="রাজশাহী">রাজশাহী</option>
                    <option value="জয়পুরহাট">জয়পুরহাট</option>
                    <option value="চাঁপাইনবাবগঞ্জ">চাঁপাইনবাবগঞ্জ</option>
                  </select>
                </div>
                <div class="field">
                  <label class="field-label">তথ্যসূত্র (Source)</label>
                  <input type="text" id="custSource" class="input" value="নিজস্ব প্রতিবেদক" oninput="debouncePreview()">
                </div>
              </div>

              <div class="field" style="margin-bottom: 14px;">
                <label class="field-label">সংবাদের আসল ছবির ইউআরএল (Image URL)</label>
                <input type="url" id="custImage" class="input" placeholder="https://example.com/photo.jpg" value="https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=1000" required onchange="debouncePreview()">
              </div>

              <div class="field" style="margin-bottom: 20px;">
                <label class="field-label">মূল সংবাদ ও বিবরণ (Story Body / Caption)</label>
                <textarea id="custSummary" class="input" rows="4" placeholder="সংবাদের বিস্তারিত বিবরণ লিখুন..." required></textarea>
              </div>

              <div style="display: flex; gap: 10px;">
                <button type="button" class="btn btn--ghost" style="flex: 1;" onclick="renderLivePreview()">
                  কার্ড প্রিভিউ আপডেট
                </button>
                <button type="submit" class="btn btn--primary" id="btnPublishCustom" style="flex: 1.2;">
                  ফেসবুকে পাবলিশ করুন 🚀
                </button>
              </div>
            </form>
          </div>

          <!-- Preview -->
          <div class="card" style="padding: 24px; display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
              <h3 style="font-size: 16px; font-weight: 700; margin: 0;">রিয়েল-টাইম ফটোকার্ড প্রিভিউ</h3>
              <span id="previewStatus" style="font-size: 12px; color: var(--t-muted);">রেডি</span>
            </div>
            <div class="preview-box" id="previewContainer">
              <span style="color: #94a3b8; font-size: 14px;">ফর্ম পূরণ করে 'কার্ড প্রিভিউ আপডেট' বাটনে ক্লিক করুন।</span>
            </div>
          </div>
        </div>

        </main>
        <div data-shell-footer></div>
      </div>
    </div>

    <script type="module" src="assets/js/index.js"></script>
    <script>
      let previewTimer = null;

      function toggleQuoteFields() {
        const tmpl = document.getElementById('custTemplate').value;
        const qBox = document.getElementById('quoteFields');
        qBox.style.display = (tmpl === 'quote') ? 'block' : 'none';
      }

      function selectCustomTemplate(tmpl) {
        document.getElementById('custTemplate').value = tmpl;
        document.querySelectorAll('.tmpl-pill').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tmpl === tmpl);
        });
        const badge = document.getElementById('activeTemplateBadge');
        if (badge) badge.textContent = tmpl.toUpperCase();
        toggleQuoteFields();
        renderLivePreview();
      }

      function debouncePreview() {
        clearTimeout(previewTimer);
        previewTimer = setTimeout(renderLivePreview, 800);
      }

      async function renderLivePreview() {
        const title = document.getElementById('custTitle').value.trim();
        const img = document.getElementById('custImage').value.trim();
        if (!title || !img) return;

        const container = document.getElementById('previewContainer');
        const status = document.getElementById('previewStatus');
        status.textContent = 'রেন্ডারিং...';

        const payload = {
          title: title,
          headline_html: title,
          template: document.getElementById('custTemplate').value,
          district: document.getElementById('custDistrict').value,
          source: document.getElementById('custSource').value,
          image_url: img,
          speaker_name: document.getElementById('custSpeakerName')?.value || '',
          speaker_title: document.getElementById('custSpeakerTitle')?.value || ''
        };

        try {
          const res = await fetch('/api/news/preview', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (data.success && data.image_uri) {
            container.innerHTML = `<img src="${data.image_uri}" style="max-height: 460px; max-width: 100%; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);" alt="Card Preview">`;
            status.textContent = 'সফল প্রিভিউ';
          } else {
            status.textContent = 'প্রিভিউ ত্রুটি';
          }
        } catch (e) {
          status.textContent = 'এরর';
        }
      }

      async function publishCustom() {
        const btn = document.getElementById('btnPublishCustom');
        btn.disabled = true;
        btn.textContent = 'পোস্ট হচ্ছে...';

        const payload = {
          title: document.getElementById('custTitle').value.trim(),
          summary: document.getElementById('custSummary').value.trim(),
          template: document.getElementById('custTemplate').value,
          district: document.getElementById('custDistrict').value,
          source: document.getElementById('custSource').value,
          image_url: document.getElementById('custImage').value.trim(),
          speaker_name: document.getElementById('custSpeakerName')?.value || '',
          speaker_title: document.getElementById('custSpeakerTitle')?.value || ''
        };

        try {
          const res = await fetch('/api/news/publish', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (data.success) {
            alert(`✅ পোস্ট সফলভাবে ফেসবুকে প্রকাশিত হয়েছে!\n\nপোস্ট আইডি: ${data.fb_post_id}\nব্যবহৃত টেমপ্লেট: ${data.template}`);
            window.location.href = 'posts.html';
          } else {
            alert('পোস্ট প্রকাশ ব্যর্থ হয়েছে: ' + (data.detail || 'ত্রুটি'));
          }
        } catch (err) {
          alert('নেটওয়ার্ক ত্রুটি: ' + err);
        } finally {
          btn.disabled = false;
          btn.textContent = 'ফেসবুকে পাবলিশ করুন 🚀';
        }
      }

      toggleQuoteFields();
    </script>
  </body>
</html>
