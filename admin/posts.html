<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>North Voice · প্রকাশিত সংবাদ ও ফেসবুক পেজ ম্যানেজার</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dash26-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <style>
      .badge-template {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .badge-viral { background: #FEF08A; color: #854D0E; }
      .badge-breaking { background: #FEE2E2; color: #991B1B; }
      .badge-inqilab_style { background: #E0E7FF; color: #3730A3; }
      .badge-quote { background: #F3E8FF; color: #6B21A8; }
      .badge-general { background: #E2E8F0; color: #334155; }
      .badge-safe { background: #DCFCE7; color: #166534; }
    </style>
  </head>
  <body data-active="posts" data-crumbs="সংবাদ ব্যবস্থাপনা | প্রকাশিত সংবাদ">
    <div class="shell">
      <div data-shell-sidebar></div>
      <div class="main">
        <div data-shell-topbar></div>
        <main class="content">

        <!-- HERO -->
        <section class="hero">
          <div class="hero-text">
            <span class="eyebrow">মেটা গ্রাফ এপিআই ও সুপাবেস সিঙ্ক</span>
            <h1 class="hero-title">প্রকাশিত সংবাদ ও <span class="accent">ফেসবুক ম্যানেজার</span></h1>
            <p class="hero-sub">ফেসবুক পেজে সফলভাবে পাবলিশ হওয়া সকল সংবাদের রিয়েল-টাইম তথ্য ও ১-ক্লিক ডিলিট সুবিধা।</p>
          </div>
          <div class="hero-actions">
            <button class="btn btn--primary" onclick="loadAllPosts()">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
              রিফ্রেশ করুন
            </button>
          </div>
        </section>

        <!-- FILTERS & TABLE -->
        <div class="card" style="padding: 24px;">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 20px;">
            <div style="display: flex; gap: 10px; flex: 1; max-width: 600px;">
              <input type="text" id="postSearch" placeholder="শিরোনাম বা হ্যাশ দিয়ে খুঁজুন..." class="input" style="font-size: 13px;" onkeyup="filterPosts()">
              <select id="templateFilter" class="input" style="max-width: 180px; font-size: 13px;" onchange="filterPosts()">
                <option value="all">সব টেমপ্লেট</option>
                <option value="viral">Viral (স্লেট ব্লু)</option>
                <option value="breaking">Breaking (ক্রিমসন)</option>
                <option value="inqilab_style">Inqilab (সম্পাদকীয়)</option>
                <option value="quote">Quote (উক্তি)</option>
                <option value="general">General (মডার্ন ব্লু)</option>
              </select>
            </div>
            <div id="postsCountBadge" style="font-size: 13px; color: var(--t-muted); font-weight: 600;">
              মোট পোস্ট: গণনা চলছে...
            </div>
          </div>

          <div class="table-wrap">
            <table class="table" style="width: 100%;">
              <thead>
                <tr>
                  <th style="width: 50%;">সংবাদের শিরোনাম (Headline)</th>
                  <th>ডিজাইন টেমপ্লেট</th>
                  <th>পোস্ট আইডি</th>
                  <th>পাবলিশ সময়</th>
                  <th style="text-align: right;">অ্যাকশন</th>
                </tr>
              </thead>
              <tbody id="postsTableBody">
                <tr>
                  <td colspan="5" style="text-align: center; padding: 40px; color: var(--t-muted);">
                    ডাটাবেস থেকে পোস্টের তালিকা লোড হচ্ছে...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        </main>
        <div data-shell-footer></div>
      </div>
    </div>

    <script type="module" src="assets/js/index.js"></script>
    <script>
      let allPosts = [];

      async function loadAllPosts() {
        try {
          const res = await fetch('/api/posts?limit=100');
          const data = await res.json();
          allPosts = data.posts || [];
          document.getElementById('postsCountBadge').textContent = `মোট পোস্ট: ${allPosts.length} টি`;
          renderPostsTable(allPosts);
        } catch (e) {
          console.error('Failed to load posts:', e);
        }
      }

      function renderPostsTable(posts) {
        const tbody = document.getElementById('postsTableBody');
        if (!posts || posts.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:40px;">কোনো পোস্ট পাওয়া যায়নি।</td></tr>';
          return;
        }

        tbody.innerHTML = posts.map(p => {
          const tmpl = p.template || 'breaking';
          const tmplBadge = `<span class="badge-template badge-${tmpl}">${tmpl}</span>`;
          const dateStr = p.created_at ? new Date(p.created_at).toLocaleString('bn-BD') : '-';
          const fbBtn = p.fb_url
            ? `<a href="${p.fb_url}" target="_blank" class="btn btn--sm btn--ghost" style="color:#2563EB;">ফেসবুক ভিউ ↗</a>`
            : `<span style="font-size:12px; color:var(--t-muted);">অটোমেটেড</span>`;

          return `
            <tr>
              <td>
                <div style="font-weight: 700; font-size: 14px; line-height: 1.45; margin-bottom: 6px;">
                  ${p.headline}
                </div>
                <div style="font-size: 11.5px; color: var(--t-muted); display: flex; gap: 12px;">
                  <span>মূল সূত্র: <a href="${p.news_url}" target="_blank" style="color:var(--t-muted); text-decoration:underline;">লিংক</a></span>
                  <span>SHA256: ${p.url_hash ? p.url_hash.slice(0, 12) + '...' : '-'}</span>
                </div>
              </td>
              <td>${tmplBadge}</td>
              <td style="font-size: 12px; font-family: monospace;">${p.fb_post_id || '-'}</td>
              <td style="font-size: 12px; color: var(--t-muted);">${dateStr}</td>
              <td style="text-align: right;">
                ${fbBtn}
                <button onclick="deletePost('${p.url_hash}')" class="btn btn--sm btn--danger" style="margin-left: 6px;">
                  মুছে ফেলুন
                </button>
              </td>
            </tr>
          `;
        }).join('');
      }

      function filterPosts() {
        const query = document.getElementById('postSearch').value.toLowerCase();
        const tmplVal = document.getElementById('templateFilter').value;

        const filtered = allPosts.filter(p => {
          const matchesQuery = p.headline.toLowerCase().includes(query) || (p.url_hash && p.url_hash.toLowerCase().includes(query));
          const matchesTmpl = tmplVal === 'all' || p.template === tmplVal;
          return matchesQuery && matchesTmpl;
        });

        renderPostsTable(filtered);
      }

      window.deletePost = async function(urlHash) {
        if (!confirm('সতর্কতা: এটি সুপাবেস ডাটাবেস এবং ফেসবুক পেজ উভয় স্থান থেকেই পোস্টটি স্থায়ীভাবে মুছে ফেলবে। নিশ্চিত করতে OK চাপুন।')) {
          return;
        }

        try {
          const res = await fetch(`/api/posts/${urlHash}`, { method: 'DELETE' });
          const data = await res.json();
          if (data.success) {
            alert('পোস্টটি সফলভাবে মুছে ফেলা হয়েছে!');
            loadAllPosts();
          } else {
            alert('মুছতে ব্যর্থ হয়েছে: ' + (data.detail || 'ত্রুটি'));
          }
        } catch (e) {
          alert('নেটওয়ার্ক ত্রুটি: ' + e);
        }
      };

      loadAllPosts();
    </script>
  </body>
</html>
